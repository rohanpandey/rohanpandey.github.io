title: Rohan Pandey
description: PhD student in Computer Science at UMass Amherst (Bio-NLP Lab) working on machine learning, NLP, and large language models (LLMs) that hold up in the real world, especially in healthcare and science.
tagline: PhD Student in AI, NLP & Healthcare, UMass Amherst
author: Rohan Pandey
url: https://rohanpandey.github.io
baseurl: ""

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

permalink: /blog/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Shown in link previews and search results
image: /images/rohan.jpg
twitter:
  card: summary
# Shown in the intro and llms.txt; delete or comment out when not looking
seeking: research internships for Summer 2027

# Research keywords used in structured data and llms.txt (keep these accurate)
keywords:
  - Machine learning
  - Natural language processing (NLP)
  - Large language models (LLMs)
  - Clinical NLP
  - AI for healthcare
  - Electronic health records (EHR)
  - Public health informatics
  - Clinical risk prediction
  - Opioid overdose prediction
  - Homelessness risk prediction
  - Science of AI
  - Robustness and reliability of AI systems
  - AI for science
  - Information retrieval
  - Benchmarks and evaluation

social:
  name: Rohan Pandey
  links:
    - https://scholar.google.com/citations?user=Xdlmg9IAAAAJ
    - https://github.com/rohanpandey
    - https://www.linkedin.com/in/therohanpandey/

# Paste the code from Google Search Console here to verify the site:
# webmaster_verifications:
#   google: XXXXXXXXXXXX

defaults:
  # Old redirect page; keep it out of the sitemap
  - scope: { path: "blogposts.html" }
    values: { sitemap: false }

feed:
  path: blog/feed.xml

